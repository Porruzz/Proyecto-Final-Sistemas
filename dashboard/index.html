<!doctype html><html lang="es"><meta charset="utf-8"><title>ComplexNet Fase 3</title><style>body{background:#101827;color:#e5edf5;font:16px system-ui;margin:32px}main{max-width:1100px;margin:auto}section{background:#1b293a;padding:20px;border-radius:12px;margin:16px 0}button,input,select,textarea{padding:9px;margin:5px;border-radius:6px;border:1px solid #54708a}button{background:#187b70;color:white;cursor:pointer}#nodes{display:flex;gap:12px;flex-wrap:wrap}.node{border:1px solid #54d9bc;padding:16px;border-radius:12px;min-width:120px}.off{border-color:#e87979}pre{white-space:pre-wrap;max-height:300px;overflow:auto}canvas{max-width:100%;image-rendering:pixelated}</style><main><h1>ComplexNet / Fase 3</h1><p>Simulación del núcleo C · reloj virtual · sin hardware</p><section><h2>Red y monitoreo</h2>Nodos <input id="n" type="number" min="3" max="6" value="3"> Pérdida % <input id="loss" type="number" min="0" max="50" value="0"><select id="strategy"><option value="0">Fitness</option><option value="1">Menor carga</option><option value="2">Round Robin</option><option value="3">Aleatoria</option></select><button onclick="act('reset',{n:+n.value,loss:+loss.value,strategy:+strategy.value})">Reiniciar</button><button onclick="act('tick')">Avanzar 2 s</button><p id="summary"></p><div id="nodes"></div><svg id="graph" viewBox="0 0 500 220" width="500"></svg></section><section><h2>Tareas y recuperación</h2><button onclick="act('task')">Ejecutar tarea</button><button onclick="act('failure')">Escenario de fallo</button><pre id="output"></pre></section><section><h2>Procesamiento distribuido de imágenes</h2><input type="file" id="file" accept="image/*"><button onclick="processImage()">Escala de grises</button><canvas id="original"></canvas> <canvas id="gray"></canvas></section><section><h2>IA: regresión lineal distribuida</h2><textarea id="points" rows="5" cols="55"></textarea><button onclick="ai()">Entrenar</button><canvas id="plot" width="500" height="230"></canvas></section><section><h2>Eventos del núcleo</h2><pre id="events"></pre></section></main><script>
const $=id=>document.getElementById(id);$('points').value=Array.from({length:60},(_,i)=>`${i},${2*i+3}`).join('\n');async function request(action,extra={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});let d=await r.json();if(d.error)throw Error(d.error);return d}async function refresh(){let d=await(await fetch('/state')).json();$('summary').textContent=`Tiempo virtual: ${d.time} ms | Tramas: ${d.sent} | Perdidas: ${d.dropped} | Disponibilidad: ${d.nodes.filter(x=>x.alive).length}/${d.nodes.length}`;$('nodes').innerHTML=d.nodes.map(x=>`<div class="node ${x.alive?'':'off'}"><b>N${x.id+1} ${x.alive?'Activo':'Inactivo'}</b><p>CPU libre ${(100*x.cpu_free).toFixed(1)}%<br>RAM libre ${(100*x.memory_free).toFixed(1)}%<br>Vecinos ${x.neighbors}<br>Completadas ${x.done}<br>Reasignadas ${x.reassigned}</p><button onclick="act('toggle',{i:${x.id},on:${+!x.alive}})">${x.alive?'Apagar':'Encender'}</button></div>`).join('');let p=d.nodes.map((x,i)=>[250+150*Math.cos(i*2*Math.PI/d.nodes.length),110+80*Math.sin(i*2*Math.PI/d.nodes.length)]);$('graph').innerHTML=p.map((a,i)=>p.slice(i+1).map((b,j)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${d.nodes[i].alive&&d.nodes[i+j+1].alive?'#438d91':'#713f49'}"/>`).join('')).join('')+p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="20" fill="${d.nodes[i].alive?'#187b70':'#a34b55'}"/><text x="${a[0]}" y="${a[1]+5}" fill="white" text-anchor="middle">N${i+1}</text>`).join('');$('events').textContent=d.events.sort((a,b)=>a.t-b.t).map(e=>`${e.t} ms | N${e.node+1} | LC ${e.lc} | ${e.event} | tarea ${e.task}`).join('\n')}
async function act(a,d={}){try{$('output').textContent=JSON.stringify(await request(a,d),null,2);await refresh()}catch(e){$('output').textContent=e.message}}async function ai(){try{let points=$('points').value.trim().split('\n').map(x=>x.split(',').map(Number));let r=await request('ai',{points});$('output').textContent=JSON.stringify(r,null,2);let c=$('plot').getContext('2d');c.clearRect(0,0,500,230);let xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),lo=Math.min(...xs),hi=Math.max(...xs),yl=Math.min(...ys),yh=Math.max(...ys);let X=x=>20+460*(x-lo)/(hi-lo||1),Y=y=>210-190*(y-yl)/(yh-yl||1);c.fillStyle='#54d9bc';for(let [x,y] of points){c.beginPath();c.arc(X(x),Y(y),3,0,7);c.fill()}c.strokeStyle='#f4a261';c.beginPath();c.moveTo(X(lo),Y(r.slope*lo+r.intercept));c.lineTo(X(hi),Y(r.slope*hi+r.intercept));c.stroke();refresh()}catch(e){alert(e.message)}}async function processImage(){try{let f=$('file').files[0];if(!f)throw Error('Selecciona una imagen');let im=await createImageBitmap(f),w=32,h=Math.max(1,Math.round(32*im.height/im.width));h=Math.min(h,32);let a=$('original'),b=$('gray');a.width=b.width=w;a.height=b.height=h;let c=a.getContext('2d');c.drawImage(im,0,0,w,h);let rgba=c.getImageData(0,0,w,h),rgb=[];for(let i=0;i<rgba.data.length;i+=4)rgb.push(...rgba.data.slice(i,i+3));let r=await request('image',{rgb:btoa(String.fromCharCode(...rgb))});let g=atob(r.gray);for(let i=0;i<g.length;i++)rgba.data.fill(g.charCodeAt(i),i*4,i*4+3);b.getContext('2d').putImageData(rgba,0,0);$('output').textContent='Ejecutores: '+r.workers.map(i=>'N'+(i+1)).join(', ');refresh()}catch(e){alert(e.message)}}refresh();</script></html>
